name: Integrate document closing
on:
  push:
    branches: [feat/document-close-workflow]
    paths: [.github/workflows/integrate-document-closing.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/EditorScene' && github.ref == 'refs/heads/feat/document-close-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Integrate document close surfaces and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files={}
          def edit(path, old, new):
              text=files.setdefault(path,Path(path).read_text())
              assert text.count(old)==1, path+': '+old[:120]
              files[path]=text.replace(old,new)
          p='src/EditorScene.Controls/EditorDocumentTabMenu.cs'
          edit(p,'return _target is not null && _enabled && scope switch','return _target is not null && _enabled && (scope switch')
          edit(p,'            _ => false\n        };','            _ => false\n        });')
          p='src/EditorScene.App/EditorPage.cs'
          text=Path(p).read_text()
          start=text.index('    private async Task CloseDocumentAsync()\n')
          end=text.index('    private void NewDocument()',start)
          edit(p,text[start:end],'')
          edit(p,'                button.Click += (_, _) => ActivateDocument(entry);\n                button.Loaded += (_, _) => { if (ReferenceEquals(entry, _current)) QueueActiveTabReveal(); };',
              '                WireDocumentTab(button, entry.Document.Id);')
          edit(p,'            if (!retained.Contains(_tabs.Children[i])) _tabs.Children.RemoveAt(i);',
              '            if (!retained.Contains(_tabs.Children[i]))\n            {\n                if (_tabs.Children[i] is Button removed) UnwireDocumentTab(removed);\n                _tabs.Children.RemoveAt(i);\n            }')
          edit(p,'        if (e.Handled) return;','        if (e.Handled || _dialog is not null) return;')
          p='src/EditorScene.App/EditorPage.Menus.cs'
          edit(p,'        Item(file, "Close", CloseDocumentAsync, "Ctrl+W"); Separator(file);',
              '        Item(file, "Close", CloseDocumentAsync, "Ctrl+W");\n        Item(file, "Close Other Documents", () => CloseCurrentDocumentsAsync(DocumentCloseScope.Others));\n        Item(file, "Close All Documents", () => CloseCurrentDocumentsAsync(DocumentCloseScope.All)); Separator(file);')
          edit(p,'    private async Task<bool> SaveDocumentAsync(bool saveAs)\n    {\n        var entry = _current; if (entry is null) return false;',
              '    private async Task<bool> SaveDocumentCoreAsync(WorkspaceDocument entry, bool saveAs)\n    {\n        if (!_documents.Contains(entry)) return false;')
          edit(p,'        var snapshot = entry.Document.Snapshot(); var encoding = entry.Document.Encoding;',
              '        if (!_documents.Contains(entry)) return false;\n        var snapshot = entry.Document.Snapshot(); var encoding = entry.Document.Encoding;')
          edit(p,'        Item(window, "Documents…", () => { DispatcherQueue.TryEnqueue(ShowDocumentList); return Task.CompletedTask; }, "Ctrl+Alt+Down");',
              '        Item(window, "Documents…", () => { DispatcherQueue.TryEnqueue(ShowDocumentList); return Task.CompletedTask; }, "Ctrl+Alt+Down");\n        Item(window, "Tab Context Menu", () => { DispatcherQueue.TryEnqueue(ShowCurrentDocumentTabMenu); return Task.CompletedTask; }, "Alt+-");')
          p='src/EditorScene.App/EditorPage.DocumentNavigation.cs'
          edit(p,'        var strip = new Grid { MinHeight = 27 };','        InitializeDocumentClosing();\n        var strip = new Grid { MinHeight = 27 };')
          edit(p,'        if (args.Handled || !_loaded || _dialog is not null) return;',
              '        if (args.Handled || !_loaded || _dialog is not null) return;\n        if (HandleDocumentClosingKey(args)) { args.Handled = true; return; }')
          p='src/EditorScene.App/EditorPage.Diagnostics.cs'
          edit(p,'            DocumentTabBuilds = _tabBuildCount, DocumentMenuBuilds = _documentList.ItemBuildCount,',
              '            DocumentTabBuilds = _tabBuildCount, DocumentMenuBuilds = _documentList.ItemBuildCount,\n            DocumentOrder = _documents.Select(d => d.Document.FileName).ToArray(), DocumentOperationBusy = _documentOperations.IsBusy,\n            DocumentTabMenuBuilds = _documentTabMenuBuilds,\n            DocumentClosePrompt = (_dialog?.Title as string) == "Save changes?" ? _dialog.Content as string : null,')
          edit(p,'    public long DocumentTabBuilds { get; set; }',
              '    public long DocumentTabBuilds { get; set; }\n    public string[] DocumentOrder { get; set; } = [];\n    public bool DocumentOperationBusy { get; set; }\n    public int DocumentTabMenuBuilds { get; set; }\n    public string? DocumentClosePrompt { get; set; }')
          edit('src/EditorScene.App/NativeEditorChecks.cs','        NativeDocumentListChecks.Run(checks);','        NativeDocumentListChecks.Run(checks);\n        NativeDocumentTabMenuChecks.Run(checks);')
          edit('tools/browser-smoke.mjs',"import {checkDocumentNavigation} from './browser-document-navigation.mjs';", "import {checkDocumentNavigation} from './browser-document-navigation.mjs';\nimport {checkDocumentClosing} from './browser-document-closing.mjs';")
          edit('tools/browser-smoke.mjs','  await checkDocumentNavigation({page,state,wait,textIs,paste,click,command,focusEditor,output,checks});','  await checkDocumentNavigation({page,state,wait,textIs,paste,click,command,focusEditor,output,checks});\n  await checkDocumentClosing({page,state,wait,textIs,paste,click,command,focusEditor,output,checks});')
          edit('tools/browser-smoke.mjs','  const click=async name=>{const b=await stableBounds(name);await page.mouse.click(b[0]+b[2]/2,b[1]+b[3]/2);};',
              '  const click=async(name,options={})=>{const b=await stableBounds(name);await page.mouse.click(b[0]+b[2]/2,b[1]+b[3]/2,options);};')
          edit('tools/package.py','        documentMenu.SelectedDocumentId = documentId;',
              '        documentMenu.SelectedDocumentId = documentId;\n        using var tabMenu = new EditorDocumentTabMenu();\n        tabMenu.Configure(documentId, 0, 1);\n        if (!tabMenu.CanInvoke(EditorScene.Text.DocumentCloseScope.Current) || tabMenu.CanInvoke(EditorScene.Text.DocumentCloseScope.Others)) throw new Exception("Packaged document tab menu contract failed.");')
          for path,text in files.items(): Path(path).write_text(text)
          PY
          git diff --check
          node --check tools/browser-smoke.mjs
          node --check tools/browser-document-closing.mjs
          python3 -m py_compile tools/package.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-document-closing.yml
          git add src tools
          git commit -m 'feat(ui): connect target-safe tab closing, save coordination and native browser checks'
          git push origin HEAD:refs/heads/feat/document-close-workflow
