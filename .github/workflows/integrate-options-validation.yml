name: Integrate options validation
on:
  push:
    branches: [feat/editor-options-tab-columns]
    paths: [.github/workflows/integrate-options-validation.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/EditorScene'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Wire actual native, browser and package checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          edits={}
          def edit(path,old,new):
              text=edits.setdefault(path,Path(path).read_text())
              assert text.count(old)==1, path+': '+old[:110]
              edits[path]=text.replace(old,new)
          p='src/EditorScene.Controls/EditorOptionsView.cs'
          edit(p,'public sealed class EditorOptionsView : UserControl','public sealed class EditorOptionsView : UserControl, IDisposable')
          edit(p,'    private readonly NumberBox _tabSize', '    private bool _disposed;\n    private readonly NumberBox _tabSize')
          edit(p,'reset.Click += (_, _) => SetOptions(new());','reset.Click += (_, _) => { if (!_disposed) SetOptions(new()); };')
          edit(p,'        options.Validate(); _tabSize.Value', '        ObjectDisposedException.ThrowIf(_disposed, this);\n        options.Validate(); _tabSize.Value')
          edit(p,'        options = default;\n        if (!double.IsFinite', '        ObjectDisposedException.ThrowIf(_disposed, this);\n        options = default;\n        if (!double.IsFinite')
          edit(p,'    public NumberBox TabSizeInput', '    public new void Dispose() { if (_disposed) return; _disposed = true; base.Dispose(); }\n    public NumberBox TabSizeInput')
          edit('src/EditorScene.App/NativeEditorChecks.cs','        await NativeDiagnosticNavigationChecks.RunAsync(checks);','        await NativeDiagnosticNavigationChecks.RunAsync(checks);\n        await NativeOptionsChecks.RunAsync(checks);')
          edit('tools/build.py','if len(checks) < 206','if len(checks) < 228')
          edit('tools/EditorScene.Benchmarks/Program.cs','DiagnosticNavigationBenchmarks.Add(rows);','DiagnosticNavigationBenchmarks.Add(rows);\nTabColumnBenchmarks.Add(rows);')
          p='tools/browser-workspace.mjs'
          edit(p,"import {checkDiagnosticGrid} from './browser-diagnostics.mjs';", "import {checkDiagnosticGrid} from './browser-diagnostics.mjs';\nimport {checkEditorOptions} from './browser-options.mjs';")
          edit(p,'  await checkDiagnosticGrid({page,state,wait,textIs,paste,click,fill,command,focusEditor,output,checks});','  await checkDiagnosticGrid({page,state,wait,textIs,paste,click,fill,command,focusEditor,output,checks});\n  await checkEditorOptions({page,state,wait,textIs,paste,click,command,output,checks});')
          p='src/EditorScene.App/EditorPage.Diagnostics.cs'
          edit(p,'            SecondaryReadOnly = _secondary?.IsReadOnly ?? false,','            SecondaryTabSize = _secondary?.TabSize ?? 0, SecondaryConvertTabsToSpaces = _secondary?.ConvertTabsToSpaces ?? false, SecondaryRulerColumn = _secondary?.RulerColumn ?? 0,\n            SecondaryReadOnly = _secondary?.IsReadOnly ?? false,')
          edit(p,'    public bool SecondaryReadOnly { get; set; }','    public int SecondaryTabSize { get; set; }\n    public bool SecondaryConvertTabsToSpaces { get; set; }\n    public int SecondaryRulerColumn { get; set; }\n    public bool SecondaryReadOnly { get; set; }')
          edit(p,'                else if (element is TextBox input && input.Name.Length > 0) Add("Dialog input " + input.Name, input);', '''                else if (element is TextBox input)
                          {
                              if (input.Name.Length > 0) Add("Dialog input " + input.Name, input);
                              for (DependencyObject? parent = VisualTreeHelper.GetParent(input); parent is not null; parent = VisualTreeHelper.GetParent(parent))
                                  if (parent is NumberBox number) { Add("Option input " + AutomationProperties.GetName(number), input); break; }
                          }''')
          p='tools/package.py'
          edit(p,'var snapshot = document.Snapshot();','''var snapshot = document.Snapshot();
          using var tabsDocument = new EditorDocument("\\tX");
          var tabs = new TabColumnMap(tabsDocument.Snapshot(), 0, 8);
          if (tabs.GetColumn(2) != 9 || tabs.GetOffset(7) != 0 || tabs.GetIndentation(2, true).Length != 7) throw new Exception("Packaged tab mapping failed.");
          var multi = new MultiSelection(tabsDocument); multi.Set([new SelectionRange(0, 0), new SelectionRange(2, 2)]);
          multi.ReplaceEach(["a", "bc"]);
          if (tabsDocument.Buffer.Text != "a\\tXbc") throw new Exception("Packaged per-caret replacement failed.");''')
          edit(p,'        Editor.NavigateToMatchingBracket();','        Editor.NavigateToMatchingBracket();\n        var options = new EditorViewOptions { TabSize = 8, ConvertTabsToSpaces = true };\n        Editor.ApplyViewOptions(options);\n        _ = Editor.GetCaretTabColumn();\n        var optionsPanel = new EditorOptionsView(options);\n        _ = optionsPanel.TryGetOptions(out var captured);\n        optionsPanel.Dispose();')
          for path,text in edits.items(): Path(path).write_text(text)
          PY
          node --check tools/browser-options.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-options-validation.yml
          git add src tools
          git commit -m 'test(options): integrate native/browser/package regressions and sparse-column benchmarks'
          git push origin HEAD:feat/editor-options-tab-columns
