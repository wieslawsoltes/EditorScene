name: Integrate grouped toolbar overflow
on:
  push:
    branches: [feat/classic-editor-workspace]
    paths: [.github/workflows/integrate-toolbar-overflow.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/EditorScene'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply checked overflow integration and real pointer regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          edits={}
          def replace(path,old,new):
              text=edits.setdefault(path,Path(path).read_text())
              assert text.count(old)==1, path+': '+old[:100]
              edits[path]=text.replace(old,new)
          path='src/EditorScene.App/EditorPage.Menus.cs'
          replace(path,'overflow.Click += (_, _) => _ = GuardAsync(action); _toolbarOverflow.Items.Add(overflow);','overflow.Click += (_, _) => _ = GuardAsync(action); AddToolbarOverflow(overflow);')
          replace(path,'_toolbar.Children.Add(border); _toolbarSeparators.Add(border); _toolbarOverflow.Items.Add(new MenuFlyoutSeparator());','_toolbar.Children.Add(border); _toolbarSeparators.Add(border);')
          path='tools/browser-workspace.mjs'
          replace(path,"  await click('Toolbar commands');await click('Visible command Find');await wait(()=>globalThis.__editorSceneState?.SearchOpen);",'''  await click('Toolbar commands');
            await wait(()=>!!globalThis.__editorSceneState?.Controls?.['Visible submenu Search']);
            const viewport=page.viewportSize();
            const groups=Object.entries((await state()).Controls).filter(([name])=>name.startsWith('Visible submenu '));
            assert.equal(groups.length,7,'Toolbar overflow must contain seven bounded command groups');
            for(const [name,b] of groups) assert.ok(b[0]>=0&&b[1]>=0&&b[0]+b[2]<=viewport.width+1&&b[1]+b[3]<=viewport.height+1,`${name} must be inside the viewport`);
            await click('Visible submenu Search');
            await wait(()=>!!globalThis.__editorSceneState?.Controls?.['Visible command Find']);
            const findBounds=(await state()).Controls['Visible command Find'];
            assert.ok(findBounds[0]>=0&&findBounds[1]>=0&&findBounds[0]+findBounds[2]<=viewport.width+1&&findBounds[1]+findBounds[3]<=viewport.height+1,'Find must be on screen before actual pointer input');
            await page.screenshot({path:path.join(output,'classic-toolbar-overflow.png')});
            await click('Visible command Find');await wait(()=>globalThis.__editorSceneState?.SearchOpen);''')
          for path,text in edits.items(): Path(path).write_text(text)
          PY
          node --check tools/browser-workspace.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-toolbar-overflow.yml
          git add src/EditorScene.App/EditorPage.Menus.cs tools/browser-workspace.mjs
          git commit -m 'fix(toolbar): integrate seven bounded overflow groups and test actual on-screen submenu navigation'
          git push origin HEAD:feat/classic-editor-workspace
          git rev-parse HEAD
