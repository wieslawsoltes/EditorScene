name: Inspect saved browser diagnostics
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/inspect-browser.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-validation
          run-id: 38003022937
          github-token: ${{ github.token }}
          path: evidence
      - name: Display browser failure state and console
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for pattern in ('failure-state.json','results.json','console.log'):
              for file in Path('evidence').rglob(pattern):
                  print('\n=== '+str(file)+' ===\n'+file.read_text()[-40000:])
          PY
