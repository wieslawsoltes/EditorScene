name: Fix native suite reentry
on:
  push:
    branches: [feat/streaming-save-all]
    paths: [.github/workflows/fix-native-suite-reentry.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/EditorScene' && github.ref == 'refs/heads/feat/streaming-save-all'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Guard suite startup before its first await and strengthen result checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files={}
          def edit(path,old,new):
              text=files.setdefault(path,Path(path).read_text())
              assert text.count(old)==1, path+': '+old[:120]
              files[path]=text.replace(old,new)
          edit('src/EditorScene.App/EditorPage.Diagnostics.cs',
              '    private readonly List<string> _nativeChecks = [];\n    private async Task RunNativeChecksAsync()\n    {\n        try',
              '    private readonly List<string> _nativeChecks = [];\n    private bool _nativeChecksStarted;\n    private async Task RunNativeChecksAsync()\n    {\n        // Native mounted-control tests temporarily replace and restore this page.\n        // Restoring it raises Loaded again; never launch a second overlapping suite.\n        if (_nativeChecksStarted) return;\n        _nativeChecksStarted = true;\n        Console.WriteLine("EditorScene native checks started.");\n        try')
          edit('tools/build.py',
              "    if len(checks) < 385 or 'EditorScene native checks passed.' not in text: raise RuntimeError('Native check evidence is incomplete.')",
              "    if text.count('EditorScene native checks started.') != 1 or text.count('EditorScene native checks passed.') != 1:\n        raise RuntimeError('Expected exactly one complete native suite invocation.')\n    if len(checks) != len(set(checks)):\n        raise RuntimeError('Duplicate native assertions suggest suite reentry or ambiguous check names.')\n    if len(checks) < 385: raise RuntimeError('Native check evidence is incomplete.')")
          for path,text in files.items(): Path(path).write_text(text)
          PY
          git diff --check
          python3 -m py_compile tools/build.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/EditorScene.App/EditorPage.Diagnostics.cs tools/build.py
          git commit -m 'fix(validation): run native checks once across page reloads and reject duplicated results'
          git push origin HEAD:refs/heads/feat/streaming-save-all
