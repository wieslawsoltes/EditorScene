name: Integrate performance validation sources
on:
  push:
    branches: [feat/performance-semantic-deltas]
    paths: [.github/workflows/integrate-performance-validation.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply exact tested tool edits
        run: |
          git apply <<'PATCH'
          diff --git a/tools/browser-lsp.mjs b/tools/browser-lsp.mjs
          index 0b464fb..9c63761 100644
          --- a/tools/browser-lsp.mjs
          +++ b/tools/browser-lsp.mjs
          @@ -11,6 +11,18 @@ export async function checkLsp({page,command,click,fill,paste,focusEditor,wait,t
             await wait(()=>{const s=globalThis.__editorSceneState;return s?.LspConnected&&s.AnalysisRevision===s.Revision&&s.Symbols.includes('RemoteDemo')&&s.ClassificationCount===2&&s.Foldings>0&&s.Diagnostics.some(d=>d.startsWith('LSP001:'));});
             await fixture.waitFor('textDocument/didOpen');assert.equal(fixture.sessions[0].text,before);
             checks.push('Explicit language-server dialog establishes real WebSocket LSP with remote diagnostics, symbols, semantic colors and folding');
          +  await focusEditor();await page.keyboard.press('Control+Home');await page.keyboard.press('Enter');
          +  await wait(()=>{const s=globalThis.__editorSceneState;return s?.LspConnected&&s.TextPrefix.startsWith('\nclass')&&s.AnalysisRevision===s.Revision&&s.ClassificationCount===2;});
          +  await fixture.waitFor('textDocument/semanticTokens/full/delta');
          +  assert.ok(fixture.journal.some(e=>e.method==='semanticTokenResponse'&&e.params.kind==='delta'&&e.params.integers<e.params.fullIntegers));
          +  checks.push('Negotiated semantic-token deltas transfer only changed integers after an editor keystroke');
          +  fixture.corruptNextDelta();const fullBefore=fixture.journal.filter(e=>e.method==='textDocument/semanticTokens/full').length;
          +  await page.keyboard.type(' ');
          +  await wait(()=>{const s=globalThis.__editorSceneState;return s?.TextPrefix.startsWith('\n class')&&s.AnalysisRevision===s.Revision&&s.ClassificationCount===2;});
          +  assert.equal(fixture.journal.filter(e=>e.method==='textDocument/semanticTokens/full').length,fullBefore+1);
          +  checks.push('Malformed semantic delta recovers once through a validated full replacement without losing editor state');
          +  await page.keyboard.press('Control+z');await page.keyboard.press('Control+z');await textIs(before);
          +  await wait(()=>globalThis.__editorSceneState?.AnalysisRevision===globalThis.__editorSceneState?.Revision);
             fixture.rejectWorkspaceEdit();await fixture.waitFor('serverRequestResult');await textIs(before);
             checks.push('Unadvertised server workspace edits are rejected without changing documents');
             await focusEditor();await page.keyboard.press('Control+Home');await page.keyboard.press('ArrowDown');await page.keyboard.press('ArrowDown');await page.keyboard.press('End');
          diff --git a/tools/build.py b/tools/build.py
          index 0529183..9d77a2b 100644
          --- a/tools/build.py
          +++ b/tools/build.py
          @@ -35,6 +35,7 @@ def tests(configuration):
                       raise RuntimeError(f'Test failure: {name}: {result}')
                   results[name] = result
               (OUT/'tests/summary.json').write_text(json.dumps(results, indent=2)+'\n')
          +    run('dotnet', 'run', '--project', ROOT/'tools/EditorScene.Benchmarks', '-c', configuration, '--', OUT/'tests/performance.json')
           
           def desktop(configuration):
               run('dotnet', 'build', APP, '-c', configuration, '-f', 'net10.0-desktop',
          diff --git a/tools/lsp-fixture.mjs b/tools/lsp-fixture.mjs
          index cdbb922..4648ba0 100644
          --- a/tools/lsp-fixture.mjs
          +++ b/tools/lsp-fixture.mjs
          @@ -30,7 +30,7 @@ export function createLspFixture(server) {
             };
             const range=(text,start,end)=>({start:position(text,start),end:position(text,end)});
             websocket.on('connection',socket=>{
          -    const session={uri:null,text:'',version:0,closed:false};sessions.push(session);
          +    const session={uri:null,text:'',version:0,closed:false,semantic:null,semanticSerial:0,corruptDelta:false};sessions.push(session);
               const reply=(id,result)=>socket.send(JSON.stringify({jsonrpc:'2.0',id,result}));
               socket.on('message',bytes=>{
                 let message;
          @@ -43,11 +43,12 @@ export function createLspFixture(server) {
                     case 'initialize':
                       assert.deepEqual(p.capabilities.general.positionEncodings,['utf-16']);
                       assert.equal(p.capabilities.workspace.applyEdit,false);
          +            assert.equal(p.capabilities.textDocument.semanticTokens.requests.full.delta,true);
                       reply(id,{capabilities:{positionEncoding:'utf-16',textDocumentSync:{openClose:true,change:2,save:{includeText:true}},
                         completionProvider:{triggerCharacters:['.']},hoverProvider:true,signatureHelpProvider:{triggerCharacters:['(']},
                         documentSymbolProvider:true,foldingRangeProvider:true,documentFormattingProvider:true,
                         diagnosticProvider:{identifier:'fixture',interFileDependencies:false,workspaceDiagnostics:false},
          -              semanticTokensProvider:{full:true,legend:{tokenTypes:['keyword','class'],tokenModifiers:[]}}}});break;
          +              semanticTokensProvider:{full:{delta:true},legend:{tokenTypes:['keyword','class'],tokenModifiers:[]}}}});break;
                     case 'initialized':break;
                     case 'textDocument/didOpen':
                       assert.equal(session.uri,null);session.uri=p.textDocument.uri;session.text=p.textDocument.text;session.version=p.textDocument.version;assert.equal(session.version,1);break;
          @@ -61,10 +62,25 @@ export function createLspFixture(server) {
                     case 'textDocument/foldingRange':{
                       const first=session.text.indexOf('{'),last=session.text.lastIndexOf('}');reply(id,first<0||last<first?[]:[{startLine:position(session.text,first).line,endLine:position(session.text,last).line,kind:'region'}]);break;
                     }
          -          case 'textDocument/semanticTokens/full':{
          +          case 'textDocument/semanticTokens/full':
          +          case 'textDocument/semanticTokens/full/delta':{
                       const tokens=[];const keyword=session.text.indexOf('class'),name=session.text.indexOf('Demo');if(keyword>=0)tokens.push([keyword,5,0]);if(name>=0)tokens.push([name,4,1]);
                       let prevLine=0,prevChar=0;const data=[];for(const [start,length,kind] of tokens){const pos=position(session.text,start);data.push(pos.line-prevLine,pos.line===prevLine?pos.character-prevChar:pos.character,length,kind,0);prevLine=pos.line;prevChar=pos.character;}
          -            reply(id,{data});break;
          +            const isDelta=method.endsWith('/delta');
          +            if(isDelta){
          +              assert.equal(p.previousResultId,session.semantic?.resultId);
          +              if(session.corruptDelta){session.corruptDelta=false;reply(id,{resultId:'invalid',edits:[{start:9999999,deleteCount:1}]});record('semanticDeltaRejectedFixture',{});break;}
          +            }
          +            const resultId='tokens-'+ (++session.semanticSerial);
          +            let result={resultId,data};
          +            if(isDelta){
          +              const old=session.semantic.data;let start=0,suffix=0;
          +              while(start<old.length&&start<data.length&&old[start]===data[start])start++;
          +              while(suffix<old.length-start&&suffix<data.length-start&&old[old.length-1-suffix]===data[data.length-1-suffix])suffix++;
          +              result={resultId,edits:start===old.length&&start===data.length?[]:[{start,deleteCount:old.length-start-suffix,data:data.slice(start,data.length-suffix)}]};
          +            }
          +            session.semantic={resultId,data};reply(id,result);
          +            record('semanticTokenResponse',{kind:isDelta?'delta':'full',integers:isDelta?result.edits.reduce((n,e)=>n+e.data.length,0):data.length,fullIntegers:data.length});break;
                     }
                     case 'textDocument/diagnostic':{
                       assert.equal(p.identifier,'fixture');const resultId='v'+session.version;
          @@ -95,6 +111,7 @@ export function createLspFixture(server) {
             });
             return {
               journal,errors,sessions,
          +    corruptNextDelta(){for(const session of sessions)session.corruptDelta=true;},
               waitFor(method){const found=journal.find(x=>x.method===method);if(found)return Promise.resolve(found);return new Promise((resolve,reject)=>{const waiter={method,resolve,timer:setTimeout(()=>{waiters.splice(waiters.indexOf(waiter),1);reject(new Error('Missing LSP message: '+method));},10000)};waiters.push(waiter);});},
               rejectWorkspaceEdit(){for(const socket of websocket.clients)socket.send(JSON.stringify({jsonrpc:'2.0',id:'reject-workspace-edit',method:'workspace/applyEdit',params:{edit:{changes:{'file:///not-opened.txt':[{range:{start:{line:0,character:0},end:{line:0,character:0}},newText:'MUST NOT APPLY'}]}}}}));},
               async close(){server.off('upgrade',upgrade);for(const socket of websocket.clients)socket.terminate();await new Promise(resolve=>websocket.close(resolve));}
          diff --git a/tools/package.py b/tools/package.py
          index 66ab436..cae815f 100644
          --- a/tools/package.py
          +++ b/tools/package.py
          @@ -58,6 +58,13 @@ using EditorScene.Rendering.Skia;
           using System.Reflection;
           using var document = new EditorDocument("using System; class C { int M() => Math.Abs(-1); }", "consumer.cs");
           var snapshot = document.Snapshot();
          +if (snapshot.GetLine(0).Length != snapshot.Length) throw new Exception("Packaged snapshot line index failed.");
          +document.Buffer.Insert(0, " "); var changed = document.Snapshot();
          +var minimal = SnapshotTextChanges.GetMinimalChange(snapshot, changed);
          +if (minimal.Offset != 0 || minimal.Length != 0 || minimal.NewText != " ") throw new Exception("Packaged history change failed.");
          +var semantic = EditorScene.Protocol.SemanticTokenData.FromFull(System.Text.Json.Nodes.JsonNode.Parse("{\\"resultId\\":\\"a\\",\\"data\\":[0,0,5,0,0]}"));
          +var delta = semantic.ApplyDelta(System.Text.Json.Nodes.JsonNode.Parse("{\\"resultId\\":\\"b\\",\\"edits\\":[{\\"start\\":1,\\"deleteCount\\":1,\\"data\\":[1]}]}"));
          +if (delta.Data[1] != 1 || semantic.Data[1] != 0) throw new Exception("Packaged immutable semantic delta failed.");
           var analysis = await new DotNetLanguage().AnalyzeAsync(snapshot);
           if (analysis.Diagnostics.Any(d => d.Severity == EditorScene.LanguageServices.IssueSeverity.Error)) throw new Exception("Packaged compiler references failed.");
           using var jsonDocument = new EditorDocument("{\\"x\\":42}");
          PATCH
      - name: Update documentation with checked anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(file, before, after):
              p=Path(file); text=p.read_text()
              if text.count(before)!=1: raise RuntimeError('Unexpected anchor in '+file)
              p.write_text(text.replace(before,after))
          replace('tools/lsp-fixture.mjs', "'tokens-'+ (++session.semanticSerial)", "'tokens-'+(++session.semanticSerial)")
          replace('README.md','folding, full semantic tokens, formatting','folding, full/delta semantic tokens, formatting')
          replace('README.md','## Validation and rendering','''## Performance and immutable line queries
          
          Snapshot position and line queries now use a persistent, bounded-chunk AVL line index without flattening the snapshot. `GetLine` and `GetLineFromOffset` expose immutable zero-based line descriptors. Unchanged snapshot capture reuses the same object, and edits reuse completed indexes. `SnapshotTextChanges.GetMinimalChange` uses bounded edit history to avoid comparing unchanged multi-megabyte text for small LSP changes.
          
          LSP semantic-token deltas retain validated result IDs and immutable data, recover once from an invalid base, and use allocation-light typed decoding. Timing/allocation comparisons run in the regression job and are retained as `performance.json`. See [performance architecture, reproducible benchmarks and limits](docs/performance.md); these CPU measurements do not claim physical-GPU or end-to-end frame-rate improvements.
          
          ## Validation and rendering''')
          replace('docs/compatibility.md','Full vendor snapshot/token-reader/search/tagger contracts and migration adapters. Existing snapshot position/line indexing still materializes its text; the new reader does not.','Full vendor snapshot/token-reader/search/tagger contracts and migration adapters. Initial line indexing still scans the document, but position/line queries no longer materialize its full text.')
          replace('docs/compatibility.md','Versioned points/spans, four boundary-affinity modes, reverse translation, undo/redo;','Persistent bounded-chunk AVL line index and immutable line descriptors; cached unchanged snapshots; versioned points/spans, four boundary-affinity modes, reverse translation, undo/redo;')
          replace('docs/compatibility.md','folding/formatting/full semantic tokens;','folding/formatting/full and delta semantic tokens; validated result-ID caching and single full recovery; history-bounded incremental text changes;')
          replace('docs/compatibility.md','semantic-token delta/range/modifier styling','semantic-token range/modifier styling')
          replace('docs/lsp.md','full relative semantic tokens and document formatting','full and delta relative semantic tokens and document formatting')
          replace('docs/lsp.md','- Full semantic tokens are supported; token deltas/range requests and multiline/overlapping tokens are not advertised. Server token modifiers are validated but not yet styled individually.','- Full and negotiated delta semantic tokens are supported with validated immutable caching and a single full replacement on an invalid delta base. Cancellation never retries; malformed full recovery fails. Token range requests and multiline/overlapping tokens are not advertised. Server token modifiers are validated but not yet styled individually.')
          replace('docs/lsp.md','## Deliberate boundaries','Incremental text changes use bounded snapshot history and persistent line indexes instead of scanning unchanged prefixes. Semantic-token decoding avoids per-token JSON position allocations. See [performance details](performance.md) for algorithms, size limits, cancellation/recovery behavior and benchmark methodology.\n\n## Deliberate boundaries')
          PY
      - name: Verify exact local source tree and commit without this transfer workflow
        run: |
          git rm .github/workflows/integrate-performance-validation.yml
          git add README.md docs tools tests
          git diff --cached --check
          test "$(git write-tree)" = 72b2a2f423aaebc39fea6547525f643b9946d656
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(performance): integrate benchmark reports, package consumers and real browser delta scenarios'
          git push origin HEAD:feat/performance-semantic-deltas
          git rev-parse HEAD
