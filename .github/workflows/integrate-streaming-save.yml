name: Integrate streaming saves
on:
  push:
    branches: [feat/streaming-save-all]
    paths: [.github/workflows/integrate-streaming-save.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/EditorScene' && github.ref == 'refs/heads/feat/streaming-save-all'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Apply exact source integrations and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files={}
          def edit(path,old,new):
              text=files.setdefault(path,Path(path).read_text())
              assert text.count(old)==1, path+': '+old[:120]
              files[path]=text.replace(old,new)
          p='src/EditorScene.App/EditorPage.Menus.cs'
          text=Path(p).read_text()
          start=text.index('    private async Task<bool> SaveDocumentCoreAsync(')
          end=text.index('    private async Task ExportAsync(',start)
          edit(p,text[start:end],'')
          edit(p,'        Item(file, "Save As…", async () => { await SaveDocumentAsync(true); });',
              '        Item(file, "Save As…", async () => { await SaveDocumentAsync(true); });\n        AddSaveAllMenu(file);')
          p='src/EditorScene.App/EditorPage.Workspace.cs'
          lines=[line for line in Path(p).read_text().splitlines() if 'Tool("Save",' in line]
          assert len(lines)==1
          edit(p,lines[0],lines[0]+'\n        AddSaveAllTool();')
          edit('src/EditorScene.App/EditorPage.ToolbarOverflow.cs','"New" or "Open" or "Save" => "File",','"New" or "Open" or "Save" or "Save All" => "File",')
          edit('src/EditorScene.App/EditorPage.DocumentNavigation.cs','        if (args.Handled || !_loaded || _dialog is not null) return;',
              '        if (args.Handled || !_loaded || _dialog is not null) return;\n        if (HandleSaveAllKey(args)) { args.Handled = true; return; }')
          edit('src/EditorScene.App/EditorPage.DocumentClosing.cs','        if (_closeTabButton is { } close && close.IsEnabled != enabled) close.IsEnabled = enabled;',
              '        if (_closeTabButton is { } close && close.IsEnabled != enabled) close.IsEnabled = enabled;\n        RefreshSaveAllControls();')
          p='src/EditorScene.App/EditorPage.cs'
          edit(p,'document.Changed += (_, _) => { RebuildTabCaptions(); QueueDiagnostics(); };',
              'document.Changed += (_, _) => { RebuildTabCaptions(); RefreshSaveAllControls(); QueueDiagnostics(); };')
          edit(p,'    private void UpdateStatus()\n    {','    private void UpdateStatus()\n    {\n        RefreshSaveAllControls();')
          p='src/EditorScene.App/EditorPage.Diagnostics.cs'
          edit(p,'            DocumentOrder = _documents.Select(d => d.Document.FileName).ToArray(), DocumentOperationBusy = _documentOperations.IsBusy,',
              '            DocumentOrder = _documents.Select(d => d.Document.FileName).ToArray(), DocumentOperationBusy = _documentOperations.IsBusy,\n            DocumentModified = _documents.Select(d => d.Document.IsModified).ToArray(), SaveAllRunning = _saveAllRunning, SaveAllTotal = _saveAllTotal, SaveAllCompleted = _saveAllCompleted,')
          edit(p,'    public string[] DocumentOrder { get; set; } = [];',
              '    public string[] DocumentOrder { get; set; } = [];\n    public bool[] DocumentModified { get; set; } = [];\n    public bool SaveAllRunning { get; set; }\n    public int SaveAllTotal { get; set; }\n    public int SaveAllCompleted { get; set; }')
          edit('src/EditorScene.App/NativeEditorChecks.cs','        NativeDocumentTabMenuChecks.Run(checks);','        NativeDocumentTabMenuChecks.Run(checks);\n        await NativeStreamingSaveChecks.RunAsync(checks);')
          edit('tools/build.py','if len(checks) < 372','if len(checks) < 380')
          p='tools/browser-smoke.mjs'
          edit(p,"import {checkDocumentClosing} from './browser-document-closing.mjs';", "import {checkDocumentClosing} from './browser-document-closing.mjs';\nimport {checkSaveAll} from './browser-save-all.mjs';")
          edit(p,'  await checkDocumentClosing({page,state,wait,textIs,paste,click,command,focusEditor,output,checks});',
              '  await checkDocumentClosing({page,state,wait,textIs,paste,click,command,focusEditor,output,checks});\n  await checkSaveAll({page,state,wait,textIs,paste,click,command,focusEditor,output,checks});')
          edit('tools/EditorScene.Benchmarks/Program.cs','WorkspaceBenchmarks.Add(rows);','WorkspaceBenchmarks.Add(rows);\nSnapshotSaveBenchmarks.Add(rows);')
          p='tools/package.py'
          edit(p,'var snapshot = document.Snapshot();', '''var snapshot = document.Snapshot();
          var saveContent = SnapshotSaveContent.Create(snapshot, new System.Text.UTF8Encoding(false, true));
          using var savedBytes = new MemoryStream();
          await saveContent.WriteToAsync(savedBytes);
          if (System.Text.Encoding.UTF8.GetString(savedBytes.ToArray()) != snapshot.GetText(0, snapshot.Length)) throw new Exception("Packaged snapshot streaming failed.");
          var savePlan = DocumentSavePlan.Create([new(document.Id, true)]);
          if (savePlan.DocumentIds.Single() != document.Id) throw new Exception("Packaged Save All planning failed.");''')
          edit(p,'        Commands.Editor = Editor;','        _ = EditorFileIcons.CreateSaveAll();\n        Commands.Editor = Editor;')
          for path,text in files.items(): Path(path).write_text(text)
          PY
          git diff --check
          node --check tools/browser-save-all.mjs
          node --check tools/browser-smoke.mjs
          python3 -m py_compile tools/build.py tools/package.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-streaming-save.yml
          git add src tools
          git commit -m 'feat(saving): integrate Save All and bounded file writing across app, tests and package consumers'
          git push origin HEAD:refs/heads/feat/streaming-save-all
