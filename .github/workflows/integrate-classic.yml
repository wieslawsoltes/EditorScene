name: Integrate classic workspace
on:
  push:
    branches: [feat/classic-editor-workspace]
    paths: [.github/workflows/integrate-classic.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/EditorScene' && github.ref == 'refs/heads/feat/classic-editor-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Apply the exact reviewed feature integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/maintenance/integrate-classic.py
          git diff --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add src tools
          git commit -m 'Connect classic workspace controls, guarded split views and real integration regressions'
          git push origin HEAD:refs/heads/feat/classic-editor-workspace
