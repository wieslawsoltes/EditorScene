name: Repair edit command focus
on:
  push:
    branches: [fix/editor-review-performance]
    paths: [.github/workflows/repair-command-focus.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply the observed focus repair and strengthen native coverage count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if text.count(old)!=1: raise RuntimeError(f'Expected one anchor: {path}')
              p.write_text(text.replace(old,new))
          replace('src/EditorScene.Controls/SyntaxEditor.Commands.cs',
              '            SetStatus(IsReadOnly ? "Read only" : "Ready"); FocusEditor();',
              '            SetStatus(IsReadOnly ? "Read only" : "Ready"); FocusAfterEditCommand();')
          p=Path('src/EditorScene.Controls/SyntaxEditor.CommandFocus.cs')
          assert not p.exists()
          p.write_text('''using Microsoft.UI.Xaml.Controls;
          using Microsoft.UI.Xaml.Media;

          namespace EditorScene.Controls;

          public sealed partial class SyntaxEditor
          {
              private void FocusAfterEditCommand()
              {
                  // Menu closure restores focus to the MenuBarItem after its callback.
                  // Defer only menu-originated commands; ordinary keyboard commands
                  // do not enqueue work. The existing generation/document guards
                  // prevent stale callbacks from stealing a new popup's focus.
                  if (IsLoaded && XamlRoot is { } root && VisualTreeHelper.GetOpenPopupsForXamlRoot(root)
                      .Any(p => p.IsOpen && p.Child is MenuFlyoutPresenter))
                      RestoreMacroFocusAfterMenusClose();
                  else FocusEditor();
              }
          }
          ''')
          replace('tools/build.py','if len(checks) < 86','if len(checks) < 104')
          replace('tools/browser-review.mjs',
              'await wait(()=>globalThis.__editorSceneState?.OpenMenuCount===0);',
              "await wait(()=>globalThis.__editorSceneState?.OpenMenuCount===0 && globalThis.__editorSceneState?.FocusedControl?.endsWith('.TextArea'));")
          PY
          git diff --check
      - name: Commit source fix and remove this one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-command-focus.yml
          git add src/EditorScene.Controls/SyntaxEditor.Commands.cs src/EditorScene.Controls/SyntaxEditor.CommandFocus.cs tools/build.py tools/browser-review.mjs
          git commit -m 'fix(input): restore native edit-command focus after menu closure without clearing selections'
          git push origin HEAD:fix/editor-review-performance
          git rev-parse HEAD
