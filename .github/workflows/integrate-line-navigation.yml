name: Integrate validated line navigation
on:
  push:
    branches: [feat/validated-go-to-line]
    paths: [.github/workflows/integrate-line-navigation.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/EditorScene' && github.ref == 'refs/heads/feat/validated-go-to-line'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Apply exact integrations and remove this one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files={}
          def edit(path,old,new):
              text=files.setdefault(path,Path(path).read_text())
              assert text.count(old)==1, path+': '+old[:100]
              files[path]=text.replace(old,new)
          p='src/EditorScene.App/EditorPage.Menus.cs'
          text=Path(p).read_text()
          start=text.index('    private async Task GoToLineAsync()\n')
          end=text.index('    private async Task<ContentDialogResult> ShowDialogAsync(',start)
          edit(p,text[start:end],'')
          p='src/EditorScene.App/EditorPage.Diagnostics.cs'
          edit(p,'            Controls = controls, Error = _lastError, NativeChecks = _nativeChecks.ToArray()',
              '            GoToLineOpen = _goToLineView is not null, GoToLineValid = _goToLineView?.IsValid ?? false,\n            GoToLineText = _goToLineView?.PositionInput.Text ?? string.Empty, GoToLineError = _goToLineView?.ValidationMessage ?? string.Empty,\n            Controls = controls, Error = _lastError, NativeChecks = _nativeChecks.ToArray()')
          edit(p,'    public bool SaveAllRunning { get; set; }',
              '    public bool SaveAllRunning { get; set; }\n    public bool GoToLineOpen { get; set; }\n    public bool GoToLineValid { get; set; }\n    public string GoToLineText { get; set; } = string.Empty;\n    public string GoToLineError { get; set; } = string.Empty;')
          edit('src/EditorScene.App/NativeEditorChecks.cs','        await NativeStreamingSaveChecks.RunAsync(checks);','        await NativeStreamingSaveChecks.RunAsync(checks);\n        NativeLineNavigationChecks.Run(checks);')
          edit('tools/build.py','if len(checks) < 385','if len(checks) < 401')
          p='tools/browser-smoke.mjs'
          edit(p,"import {checkSaveAll} from './browser-save-all.mjs';", "import {checkSaveAll} from './browser-save-all.mjs';\nimport {checkLineNavigation} from './browser-line-navigation.mjs';")
          edit(p,'  await checkSaveAll({page,state,wait,textIs,paste,click,command,focusEditor,output,checks});',
              '  await checkSaveAll({page,state,wait,textIs,paste,click,command,focusEditor,output,checks});\n  await checkLineNavigation({page,state,wait,textIs,paste,click,fill,command,focusEditor,output,checks});')
          edit('tools/EditorScene.Benchmarks/Program.cs','WorkspaceBenchmarks.Add(rows);','WorkspaceBenchmarks.Add(rows);\nLineNavigationBenchmarks.Add(rows);')
          p='tools/package.py'
          edit(p,'var snapshot = document.Snapshot();',
              'var snapshot = document.Snapshot();\nif (!LineNavigationTarget.TryParse(snapshot, "1:2", out var lineTarget, out _) || lineTarget.Offset != 1 || !lineTarget.IsCurrent(snapshot)) throw new Exception("Packaged line navigation failed.");')
          edit(p,'        Commands.Editor = Editor;',
              '        using var navigationDraft = new EditorGoToLineView(Editor.Document.Snapshot(), 0);\n        if (!navigationDraft.TryGetTarget(out var lineTarget) || !Editor.TryNavigateTo(lineTarget)) throw new Exception("Packaged native navigation failed.");\n        Commands.Editor = Editor;')
          for path,text in files.items(): Path(path).write_text(text)
          PY
          git diff --check
          node --check tools/browser-line-navigation.mjs
          node --check tools/browser-smoke.mjs
          python3 -m py_compile tools/build.py tools/package.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-line-navigation.yml
          git add src tools
          git commit -m 'feat(ui): integrate validated revision-safe Go To Line and native/browser regressions'
          git push origin HEAD:refs/heads/feat/validated-go-to-line
