name: Integrate whitespace editing
on:
  push:
    branches: [feat/whitespace-editing-parity]
    paths: [.github/workflows/integrate-whitespace.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/EditorScene'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply exact reviewed integration edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files={}
          def edit(path,old,new):
              text=files.setdefault(path,Path(path).read_text())
              assert text.count(old)==1, path+': '+old[:120]
              files[path]=text.replace(old,new)
          def block(path,start,end,replacement):
              text=files.setdefault(path,Path(path).read_text())
              assert text.count(start)==1 and text.count(end)==1, path
              a=text.index(start); b=text.index(end,a); files[path]=text[:a]+replacement+text[b:]
          edit('src/EditorScene.Controls/EditorCommand.cs',
              'SelectToMatchingBracket, ExpandSelection, ContractSelection',
              'SelectToMatchingBracket, ExpandSelection, ContractSelection,\n    TabifySelectedLines, UntabifySelectedLines, ConvertSelectedSpacesToTabs, ConvertSelectedTabsToSpaces')
          p='src/EditorScene.Controls/SyntaxEditor.Commands.cs'
          edit(p,'case EditorCommand.TrimTrailingWhitespace: EditSelectedLines(line => line.TrimEnd(\' \', \'\\t\'), wholeDocumentWhenEmpty: true); break;',
              'case EditorCommand.TrimTrailingWhitespace: if (TrimTrailingWhitespace()) FocusAfterEditCommand(); return;')
          edit(p,'case EditorCommand.TabsToSpaces: ConvertIndentation(false); break;',
              'case EditorCommand.TabsToSpaces: if (ChangeWhitespace(WhitespaceConversion.Spaces, true, true, true)) FocusAfterEditCommand(); return;')
          edit(p,'case EditorCommand.SpacesToTabs: ConvertIndentation(true); break;', '''case EditorCommand.SpacesToTabs: if (ChangeWhitespace(WhitespaceConversion.Tabs, true, true, true)) FocusAfterEditCommand(); return;
                          case EditorCommand.TabifySelectedLines: if (TabifySelectedLines(true)) FocusAfterEditCommand(); return;
                          case EditorCommand.UntabifySelectedLines: if (TabifySelectedLines(false)) FocusAfterEditCommand(); return;
                          case EditorCommand.ConvertSelectedSpacesToTabs: if (ConvertSelectedWhitespace(true)) FocusAfterEditCommand(); return;
                          case EditorCommand.ConvertSelectedTabsToSpaces: if (ConvertSelectedWhitespace(false)) FocusAfterEditCommand(); return;''')
          block(p,'    private void ConvertIndentation(bool tabs)','    private void ConvertLineEndings','')
          p='src/EditorScene.App/EditorPage.Menus.cs'
          edit(p,' Command(advanced, "Trim Trailing Whitespace", EditorCommand.TrimTrailingWhitespace);','')
          edit(p,'        Command(advanced, "Convert Leading Tabs to Spaces", EditorCommand.TabsToSpaces); Command(advanced, "Convert Leading Spaces to Tabs", EditorCommand.SpacesToTabs);','        AddWhitespaceMenu(advanced);')
          edit('src/EditorScene.App/NativeEditorChecks.cs','        await NativePermissionReviewChecks.RunAsync(checks);','        await NativePermissionReviewChecks.RunAsync(checks);\n        await NativeWhitespaceChecks.RunAsync(checks);')
          edit('tools/build.py','if len(checks) < 259','if len(checks) < 276')
          edit('tools/browser-smoke.mjs',"import {checkDiagnosticNavigation} from './browser-diagnostic-navigation.mjs';", "import {checkDiagnosticNavigation} from './browser-diagnostic-navigation.mjs';\nimport {checkWhitespace} from './browser-whitespace.mjs';")
          edit('tools/browser-smoke.mjs','  await checkDiagnosticNavigation({page,state,wait,textIs,paste,click,fill,command,focusEditor,output,checks});','  await checkDiagnosticNavigation({page,state,wait,textIs,paste,click,fill,command,focusEditor,output,checks});\n  await checkWhitespace({page,state,wait,textIs,paste,click,command,focusEditor,output,checks});')
          edit('tools/EditorScene.Benchmarks/Program.cs','WorkspaceBenchmarks.Add(rows);','WorkspaceBenchmarks.Add(rows);\nWhitespaceBenchmarks.Add(rows);')
          edit('tools/package.py','var snapshot = document.Snapshot();', '''var snapshot = document.Snapshot();
          using var whitespaceDocument = new EditorDocument("a" + (char)9 + "b"); var whitespaceSnapshot = whitespaceDocument.Snapshot();
          var whitespacePlan = WhitespaceEditPlan.Create(whitespaceSnapshot.GetSpan(0, whitespaceSnapshot.Length), WhitespaceConversion.Spaces);
          whitespacePlan.Apply(whitespaceDocument);
          if (whitespaceDocument.Buffer.Text != "a   b" || whitespacePlan.Edits.Length != 1) throw new Exception("Packaged whitespace planning failed.");''')
          edit('tools/package.py','    public bool Contract() => Editor.ContractSelection();','    public bool Contract() => Editor.ContractSelection();\n    public bool ConvertWhitespace() => Editor.ConvertSelectedWhitespace(false);\n    public bool TabifyLines() => Editor.TabifySelectedLines(true);')
          for path,text in files.items(): Path(path).write_text(text)
          PY
          git diff --check
          node --check tools/browser-whitespace.mjs
          python3 -m py_compile tools/build.py tools/package.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-whitespace.yml
          git add src tools
          git commit -m 'feat(editor): integrate whitespace scope commands, native menus and full regression coverage'
          git push origin HEAD:feat/whitespace-editing-parity
