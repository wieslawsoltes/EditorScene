    branches: [feat/performance-semantic-deltas]
    paths: [.github/workflows/integrate-semantic-deltas.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
