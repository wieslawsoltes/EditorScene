name: Prepare offline development dependencies
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/development-cache.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_INSTALL_DIR: /tmp/editorscene-dotnet
      NUGET_PACKAGES: /tmp/editorscene-nuget
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wieslawsoltes/AvaloniaEdit
          ref: 1a2df473f157a0127d2559f241dc712d1ce60188
          path: unoedit
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Restore pinned native editor, rendering and regression dependencies
        run: |
          cd unoedit
          dotnet restore src/UnoEdit.Uno.Demo/UnoEdit.Uno.Demo.csproj -p:DemoTargetFrameworks=net10.0-desktop -p:UnoEditTargetFrameworks=net10.0-desktop
          dotnet restore test/UnoEdit.Core.Tests/UnoEdit.Core.Tests.csproj
          dotnet restore test/UnoEdit.Rendering.Skia.Tests/UnoEdit.Rendering.Skia.Tests.csproj
          dotnet restore test/UnoEdit.Uno.Tests/UnoEdit.Uno.Tests.csproj -p:UnoEditTargetFrameworks=net10.0-desktop
      - name: Restore language analysis packages
        run: |
          mkdir -p /tmp/editor-language-probe
          cat > /tmp/editor-language-probe/Probe.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.CodeAnalysis.CSharp.Features" Version="5.9.0" />
              <PackageReference Include="Microsoft.CodeAnalysis.VisualBasic.Features" Version="5.9.0" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore /tmp/editor-language-probe/Probe.csproj
      - name: Archive SDK and public package binaries only
        run: |
          mkdir -p artifacts
          dotnet --info > artifacts/toolchain.txt
          tar -czf artifacts/dotnet-sdk.tar.gz -C "$DOTNET_INSTALL_DIR" .
          tar -czf artifacts/nuget-packages.tar.gz -C "$NUGET_PACKAGES" .
          sha256sum artifacts/*.tar.gz > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: development-dependencies
          path: artifacts
          compression-level: 0
          retention-days: 3
