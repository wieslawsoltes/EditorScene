name: Integrate review regression coverage
on:
  push:
    branches: [fix/editor-review-performance]
    paths: [.github/workflows/install-review-checks.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply checked test and lifecycle integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if text.count(old)!=1: raise RuntimeError(f'Expected one anchor in {path}: {old[:90]}')
              p.write_text(text.replace(old,new))
          p='src/EditorScene.Controls/SyntaxEditor.cs'
          replace(p,'        if (_disposed || document is null) return;\n        ClosePopups();','        if (_disposed || document is null) return;\n        _brackets = null;\n        ClosePopups();')
          replace(p,'if (_brackets?.Revision == Document.Revision && _brackets.TryGetPair', 'if (_brackets?.DocumentId == Document.Id && _brackets.Revision == Document.Revision && _brackets.TryGetPair')
          replace(p,'        _coordinator.RequestAnalysis(true);\n    }','        StateChanged?.Invoke(this, EventArgs.Empty);\n        _coordinator.RequestAnalysis(true);\n    }')
          replace('src/EditorScene.Controls/SyntaxEditor.Macros.cs','or EditorCommand.SignatureHelp or EditorCommand.SelectNextOccurrence);','or EditorCommand.SignatureHelp or EditorCommand.SelectNextOccurrence or EditorCommand.SelectAllOccurrences or EditorCommand.GoToMatchingBracket or EditorCommand.SelectToMatchingBracket);')
          replace('src/EditorScene.App/NativeEditorChecks.cs','        await NativeMacroChecks.RunAsync(checks);','        await NativeMacroChecks.RunAsync(checks);\n        await NativeReviewChecks.RunAsync(checks);')
          replace('src/EditorScene.App/NativeReviewChecks.cs','        Check(editor.Analysis is not null,','        editor.RequestAnalysis();\n        Check(editor.Analysis is not null,')
          p='src/EditorScene.App/EditorPage.Diagnostics.cs'
          replace(p,'            SelectionCount = _active.Selections.Ranges.Count, DocumentCount = _documents.Count,','            SelectionCount = _active.Selections.Ranges.Count, DocumentCount = _documents.Count,\n            BracketPairs = _active.BracketPairCount, IndentGuides = _active.ShowIndentGuides, Ruler = _active.ShowRuler,\n            IconCount = _icons.Count, RegisteredTabCount = _tabControlNames.Count,')
          replace(p,'    public int DocumentCount { get; set; }','    public int DocumentCount { get; set; }\n    public int BracketPairs { get; set; }\n    public bool IndentGuides { get; set; }\n    public bool Ruler { get; set; }\n    public int IconCount { get; set; }\n    public int RegisteredTabCount { get; set; }')
          p='tools/browser-smoke.mjs'
          replace(p,"import {checkMacros} from './browser-macros.mjs';", "import {checkMacros} from './browser-macros.mjs';\nimport {checkReview} from './browser-review.mjs';")
          replace(p,'  await checkMacros({page, state, wait, textIs, paste, click, command, output, checks});','  await checkReview({page,state,wait,textIs,paste,click,command,focusEditor,output,checks});\n  await checkMacros({page, state, wait, textIs, paste, click, command, output, checks});')
          replace('tools/EditorScene.Benchmarks/Program.cs','var report = new { sourceRevision', 'ReviewBenchmarks.Add(rows);\nvar report = new { sourceRevision')
          p='tools/package.py'
          replace(p,'var analysis = await new DotNetLanguage().AnalyzeAsync(snapshot);','''var literal = new SnapshotLiteralSearch("class", wholeWord: true);
          if (literal.FindNext(snapshot, 0)?.Text != "class") throw new Exception("Packaged literal search failed.");
          var map = new EditorScene.LanguageServices.BracketMap(snapshot, []);
          if (map.PairCount < 1) throw new Exception("Packaged bracket map failed.");
          var rangeIndex = new EditorScene.LanguageServices.RangeIndex<int>([0, 5, 10], x => new(x, 1));
          var hits = new List<int>(); rangeIndex.CopyOverlaps(new(4, 3), hits);
          if (hits.Count != 1 || hits[0] != 5) throw new Exception("Packaged range index failed.");
          var analysis = await new DotNetLanguage().AnalyzeAsync(snapshot);''')
          replace(p,'        var navigation = new NavigableSymbolSelector { Editor = Editor };','        Editor.SetDocumentAndLanguage(Editor.Document, new JsonLanguage());\n        Editor.NavigateToMatchingBracket();\n        var navigation = new NavigableSymbolSelector { Editor = Editor };')
          PY
          git diff --check
      - name: Commit checked coverage and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/install-review-checks.yml
          git add src tools
          git commit -m 'test(review): wire native/browser regressions, package consumers and reproducible hot-path benchmarks'
          git push origin HEAD:fix/editor-review-performance
          git rev-parse HEAD
