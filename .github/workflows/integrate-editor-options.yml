name: Integrate editor options
on:
  push:
    branches: [feat/editor-options-tab-columns]
    paths: [.github/workflows/integrate-editor-options.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/EditorScene'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply exact integration edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          edits={}
          def edit(path,old,new):
              text=edits.setdefault(path,Path(path).read_text())
              assert text.count(old)==1, path+': '+old[:120]
              edits[path]=text.replace(old,new)
          p='src/EditorScene.Controls/SyntaxEditor.cs'
          edit(p,'        InitializeMacroSupport(); Loaded += OnLoaded;','        InitializeMacroSupport(); Loaded += OnLoaded; _editor.OptionChanged += OnNativeOptionChanged;')
          edit(p,'ShowRuler = _showRuler };','ShowRuler = _showRuler, RulerColumn = _rulerColumn };')
          edit(p,'        ResetSelectionExpansion();\n        if (!_multiEditing)', '        ResetSelectionExpansion(); _columnMap = null;\n        if (!_multiEditing)')
          edit(p,'        ResetSelectionExpansion(); DisposeMacroSupport(); ClosePopups(); _disposed = true; Loaded -= OnLoaded;',
              '        ResetSelectionExpansion(); DisposeMacroSupport(); ClosePopups(); _disposed = true; Loaded -= OnLoaded;\n        _editor.OptionChanged -= OnNativeOptionChanged; _columnMap = null;')
          p='src/EditorScene.Controls/SyntaxEditor.Commands.cs'
          edit(p,'case EditorCommand.Indent: _editor.TextArea.Session.Indent(); break;', 'case EditorCommand.Indent: IndentWithTabStops(); break;')
          p='src/EditorScene.Controls/SyntaxEditor.Input.cs'
          edit(p,'        EditorCommand? action = null;', '''        if (!command && !alt && !shift && e.Key == VirtualKey.Tab && !IsSnippetActive && !IsCompletionOpen && _editor.Options.AcceptsTab)
                  { e.Handled = true; _ = ExecuteAsync(EditorCommand.Indent); return; }
                  EditorCommand? action = null;''')
          p='src/EditorScene.Controls/SyntaxEditor.Macros.cs'
          edit(p,'                else if (step.Command == "clearSelection")', '                else if (step.Command == "native.Tab") IndentWithTabStops();\n                else if (step.Command == "clearSelection")')
          p='src/EditorScene.Controls/SyntaxEditor.ViewSettings.cs'
          edit(p,'step < 10', 'step < 13')
          edit(p,'                    case 9: expected = expected with { Theme = desired.Theme }; Theme = desired.Theme; break;', '''                    case 9: expected = expected with { Theme = desired.Theme }; Theme = desired.Theme; break;
                              case 10: expected = expected with { TabSize = desired.TabSize }; TabSize = desired.TabSize; break;
                              case 11: expected = expected with { Spaces = desired.Spaces }; ConvertTabsToSpaces = desired.Spaces; break;
                              case 12: expected = expected with { RulerColumn = desired.RulerColumn }; RulerColumn = desired.RulerColumn; break;''')
          edit(p,'editor.AutoShowCompletion, editor.FontSize, editor.Theme);','editor.AutoShowCompletion, editor.FontSize, editor.Theme, editor.TabSize, editor.ConvertTabsToSpaces, editor.RulerColumn);')
          edit(p,'bool Brackets, bool Completion, double FontSize, EditorTheme Theme);','bool Brackets, bool Completion, double FontSize, EditorTheme Theme, int TabSize, bool Spaces, int RulerColumn);')
          p='src/EditorScene.Controls/EditorStatusBar.cs'
          edit(p,'editor.Status, document.Encoding.WebName, _prefix);','editor.Status, document.Encoding.WebName, _prefix, editor.TabSize);')
          edit(p,'Col {location.Column:N0}', 'Col {editor.GetCaretTabColumn():N0}')
          edit(p,'string Status, string Encoding, string Prefix);','string Status, string Encoding, string Prefix, int TabSize);')
          edit(p,'        var editor = _editor;\n        if (editor is null)', '        var editor = _editor;\n        if (editor?.IsDisposed == true) { Editor = null; return; }\n        if (editor is null)')
          p='src/EditorScene.App/EditorPage.Menus.cs'
          edit(p,'        var window = Menu("Window");','        Separator(view);\n        Item(view, "Editor Options…", () => _active.ShowViewOptionsAsync());\n        var window = Menu("Window");')
          p='src/EditorScene.App/EditorPage.Diagnostics.cs'
          edit(p,'            StatusPosition = _editorStatus.PositionText,', '            TabSize = _active.TabSize, ConvertTabsToSpaces = _active.ConvertTabsToSpaces, RulerColumn = _active.RulerColumn,\n            OptionsDialogOpen = _active.IsOptionsDialogOpen, ColumnMapBuilds = _active.ColumnMapBuildCount,\n            StatusPosition = _editorStatus.PositionText,')
          edit(p,'    public string StatusPosition { get; set; } = "";', '    public int TabSize { get; set; }\n    public bool ConvertTabsToSpaces { get; set; }\n    public int RulerColumn { get; set; }\n    public bool OptionsDialogOpen { get; set; }\n    public long ColumnMapBuilds { get; set; }\n    public string StatusPosition { get; set; } = "";')
          p='src/EditorScene.Controls/SyntaxEditor.OptionsDialog.cs'
          edit(p,'_optionsDialogOpen = true; StateChanged?.Invoke(this, EventArgs.Empty);','_optionsDialogOpen = true;')
          edit(p,'            if (!_disposed) { SetStatus("Editor options applied"); FocusEditor(); }','            if (!_disposed) SetStatus("Editor options applied");\n            if (!_disposed && ReferenceEquals(Document, document) && ReferenceEquals(SyntaxLanguage, language) && GetViewOptions() == desired) FocusEditor();')
          for path,text in edits.items(): Path(path).write_text(text)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-editor-options.yml
          git add src
          git commit -m 'feat(editor): wire options dialog, tab-aware status/indentation and split inheritance'
          git push origin HEAD:feat/editor-options-tab-columns
