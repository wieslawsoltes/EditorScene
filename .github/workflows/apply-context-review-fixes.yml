name: Apply context review fixes
on:
  push:
    branches: [feat/context-menu-command-review]
    paths: [.github/workflows/apply-context-review-fixes.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/EditorScene' && github.ref == 'refs/heads/feat/context-menu-command-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply hash-checked source and verify the locally tested tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0a5a1e7978c0f181ee542dd2ddd01c538ed285bcaf70ed0a82db6bc2ca0a8377'
          pathlib.Path('/tmp/context-fixes.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/context-fixes.patch
          git apply --index /tmp/context-fixes.patch
          git rm --cached .github/workflows/apply-context-review-fixes.yml
          test "$(git write-tree)" = 'bc4545b40a474e0ca4d775ee83fbc4f21e4890c9'
          git add .github/workflows/apply-context-review-fixes.yml
          git diff --cached --check
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix(editor): validate visible numeric drafts and restore focus after context toggles'
          git push origin HEAD:refs/heads/feat/context-menu-command-review
