name: Complete reviewed editor integration
on:
  push:
    branches: [fix/editor-review-performance]
    paths: [.github/workflows/complete-review-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Complete checked source integration without dropping LSP save notification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/integrate-review.yml').read_text()
          begin = "          python3 - <<'PY'\n"
          end = "          PY\n"
          assert workflow.count(begin) == 1 and workflow.count(end) == 1
          code = textwrap.dedent(workflow.split(begin,1)[1].split(end,1)[0])
          old = 'AddEvent("Saved " + file.Name); return'
          new = 'AddEvent("Saved " + file.Name); await NotifyLspSavedAsync(entry, snapshot); return'
          assert code.count(old) == 2, 'Expected the old and new save-tail anchors'
          code = code.replace(old, new)
          exec(compile(code, 'reviewed-source-integration', 'exec'), {})
          PY
          git diff --check
      - name: Commit source integration and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-review.yml .github/workflows/complete-review-integration.yml
          git add src
          git commit -m 'fix(controls): integrate streaming search, bracket commands, snapshot-safe IO and workspace lifecycle fixes'
          git push origin HEAD:fix/editor-review-performance
          git rev-parse HEAD
