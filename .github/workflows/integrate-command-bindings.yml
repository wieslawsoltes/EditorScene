name: Integrate native command bindings
on:
  push:
    branches: [feat/command-surface-parity]
    paths: [.github/workflows/integrate-command-bindings.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'wieslawsoltes/EditorScene' && github.ref == 'refs/heads/feat/command-surface-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed integration and remove this one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files={}
          def edit(path,old,new):
              text=files.setdefault(path,Path(path).read_text())
              assert text.count(old)==1, path+': '+old[:100]
              files[path]=text.replace(old,new)
          p='src/EditorScene.App/EditorPage.Menus.cs'
          edit(p,'private void Command(MenuBarItem menu, string label, EditorCommand command, string shortcut = "") => Item(menu, label, async () => { await _active.ExecuteAsync(command); AddEvent(label); }, shortcut);',
              'private void Command(MenuBarItem menu, string label, EditorCommand command, string shortcut = "") => AddBoundMenuCommand(menu, label, command, shortcut);')
          edit(p,'private void ToolCommand(string label, EditorIconKind icon, EditorCommand command) => Tool(label, icon, () => _active.ExecuteAsync(command));',
              'private void ToolCommand(string label, EditorIconKind icon, EditorCommand command) => AddBoundToolCommand(label, icon, command);')
          p='src/EditorScene.App/EditorPage.cs'
          edit(p,'        BuildLayout(); WireEditor(_primary); SetActive(_primary);',
              '        BuildLayout(); WireEditor(_primary); SetActive(_primary);\n        _commandBindings.ExecutionFailed += (_, error) => { _lastError = error.Message; AddEvent("Error: " + error.Message); QueueDiagnostics(); };')
          edit(p,'_loaded = true; ApplyTheme(_theme);', '_loaded = true; _commandBindings.Editor = _active; ApplyTheme(_theme);')
          edit(p,'Unloaded += (_, _) => _loaded = false;', 'Unloaded += (_, _) => { _loaded = false; _commandBindings.Editor = null; };')
          edit(p,'_errors.Editor = editor; _editorStatus.Editor = editor;', '_errors.Editor = editor; _editorStatus.Editor = editor; _commandBindings.Editor = editor;')
          p='src/EditorScene.App/EditorPage.Diagnostics.cs'
          edit(p,'        var contextItems = new Dictionary<string, bool>(StringComparer.Ordinal);',
              '        var contextItems = new Dictionary<string, bool>(StringComparer.Ordinal);\n        var visibleCommandEnabled = new Dictionary<string, bool>(StringComparer.Ordinal);')
          edit(p,'                    Add("Visible command " + item.Text, item);',
              '                    Add("Visible command " + item.Text, item); visibleCommandEnabled[item.Text] = item.IsEnabled;')
          edit(p,'            Controls = controls, Error = _lastError, NativeChecks = _nativeChecks.ToArray()', '''            CommandSurfaceEnabled = _ui.Where(p => p.Value is Control && (p.Key.StartsWith("Toolbar ", StringComparison.Ordinal) || p.Key.StartsWith("Command ", StringComparison.Ordinal))).ToDictionary(p => p.Key, p => ((Control)p.Value).IsEnabled),
                      ToolbarGlyphOpacity = _ui.Where(p => p.Key.StartsWith("Toolbar ", StringComparison.Ordinal) && p.Value is Button { Content: UIElement }).ToDictionary(p => p.Key, p => ((UIElement)((Button)p.Value).Content).Opacity),
                      VisibleCommandEnabled = visibleCommandEnabled, CommandBindingCount = _commandBindings.Count, CommandBindingDistinct = _commandBindings.DistinctCommandCount,
                      CommandBindingQueries = _commandBindings.QueryCount, CommandBindingWrites = _commandBindings.PropertyWriteCount,
                      Controls = controls, Error = _lastError, NativeChecks = _nativeChecks.ToArray()''')
          edit(p,'    public Dictionary<string, NumericOptionState> OptionInputs { get; set; } = [];', '''    public Dictionary<string, bool> CommandSurfaceEnabled { get; set; } = [];
              public Dictionary<string, bool> VisibleCommandEnabled { get; set; } = [];
              public Dictionary<string, double> ToolbarGlyphOpacity { get; set; } = [];
              public int CommandBindingCount { get; set; }
              public int CommandBindingDistinct { get; set; }
              public long CommandBindingQueries { get; set; }
              public long CommandBindingWrites { get; set; }
              public Dictionary<string, NumericOptionState> OptionInputs { get; set; } = [];''')
          edit('src/EditorScene.App/NativeEditorChecks.cs','        await NativeContextMenuChecks.RunAsync(checks);', '        await NativeContextMenuChecks.RunAsync(checks);\n        await NativeCommandBindingChecks.RunAsync(checks);')
          edit('tools/build.py','if len(checks) < 306','if len(checks) < 328')
          edit('tools/browser-smoke.mjs',"import {checkContextMenu} from './browser-context-menu.mjs';", "import {checkContextMenu} from './browser-context-menu.mjs';\nimport {checkCommandBindings} from './browser-command-bindings.mjs';")
          edit('tools/browser-smoke.mjs','  await checkContextMenu({page,state,wait,textIs,paste,click,command,focusEditor,output,checks});', '  await checkContextMenu({page,state,wait,textIs,paste,click,command,focusEditor,output,checks});\n  await checkCommandBindings({page,state,wait,textIs,paste,click,command,focusEditor,output,checks});')
          edit('tools/browser-command-bindings.mjs',"  await textIs('abcdef');await focusEditor();", "  await click('Language');await click('Choice C#');await wait(()=>globalThis.__editorSceneState?.Language==='csharp');\n  await textIs('abcdef');await focusEditor();")
          edit('tools/package.py','public sealed class ConsumerControl : UserControl\n{','public sealed class ConsumerControl : UserControl\n{\n    public EditorCommandBindings Commands { get; } = new();')
          edit('tools/package.py','        var diagnostics = new DiagnosticList { Editor = Editor };', '''        Commands.Editor = Editor;
                  var copyButton = new Button { Content = "Copy" };
                  Commands.Bind(copyButton, EditorCommand.Copy);
                  Commands.Bind(new MenuFlyoutItem(), EditorCommand.Copy, executeOnClick: false);
                  Commands.Refresh();
                  if (Commands.Count != 2 || Commands.DistinctCommandCount != 1) throw new Exception("Packaged command binding contract failed.");
                  _ = Editor.GetCommandState(EditorCommand.Indent, EditorCommandQueryMode.CommandSurface);
                  var diagnostics = new DiagnosticList { Editor = Editor };''')
          edit('tools/package.py','Children = { navigation, split, status, diagnostics, outline, picker, new EditorIcon() }','Children = { copyButton, navigation, split, status, diagnostics, outline, picker, new EditorIcon() }')
          for path,text in files.items(): Path(path).write_text(text)
          PY
          git diff --check
          node --check tools/browser-command-bindings.mjs
          node --check tools/browser-smoke.mjs
          python3 -m py_compile tools/build.py tools/package.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-command-bindings.yml
          git add src tools
          git commit -m 'feat(ui): integrate active-view command state across native menus, toolbar and overflow'
          git push origin HEAD:refs/heads/feat/command-surface-parity
