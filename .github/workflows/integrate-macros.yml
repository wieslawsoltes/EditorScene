name: Integrate native macro commands
on:
  push:
    branches: [feat/reusable-uno-editor]
    paths: [.github/workflows/integrate-macros.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply the previously verified source integration script
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          source=subprocess.check_output(['git','show','b9b7afab414beef9396eb4f7641b9c6e3e37a0c1:.github/workflows/integrate-macros.yml'],text=True)
          start=source.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=source.index('\n          PY\n',start)
          script=textwrap.dedent(source[start:end])
          exec(compile(script,'verified-macro-integration.py','exec'))
          PY
          # CI is authorized to push source, not workflow modifications. Restore
          # workflow files; those are updated separately through the GitHub connection.
          git restore --source=HEAD -- .github/workflows
          git diff --check
          node --check tools/browser-smoke.mjs
      - name: Commit only source and test integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tools
          git diff --cached --name-only
          git diff --cached --quiet -- .github/workflows
          git commit -m 'feat(controls): integrate macro lifecycle, commands, menus and native/browser regressions'
          git push origin HEAD:feat/reusable-uno-editor
          git rev-parse HEAD
